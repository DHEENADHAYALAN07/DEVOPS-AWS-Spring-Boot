name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ github.sha }} .

      - name: Tag Docker image as latest
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ github.sha }}

      - name: Push latest image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:latest